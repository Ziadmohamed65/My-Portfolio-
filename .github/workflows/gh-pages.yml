name: Build and Deploy Hugo Site to GitHub Pages

on:
  push:
    branches:
      - main   # Trigger deployment on push to main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository including submodules (themes)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Step 2: Setup Hugo
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.141.0'   # match Blowfish theme requirement
          extended: true

      # Step 3: Build Hugo site
      - name: Build Hugo site
        run: hugo --cleanDestinationDir --minify

      # Step 4: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true             # 🔹 Overwrites gh-pages branch completely
          commit_message: "Automated Hugo build and deploy"
          # cname: yourdomain.com       # Uncomment if you use a custom domain

